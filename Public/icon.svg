<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Glow Gradient for 't' -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Filter Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Square Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Subtle Border Glow -->
  <rect width="512" height="512" rx="115" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3" />

  <!-- Abstract Design Elements (Pulse / Time wave) -->
  <path d="M 80 320 Q 180 220 256 320 T 432 240" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.25" stroke-linecap="round" />

  <!-- Main Letter 't.' -->
  <g filter="url(#glow)">
    <text x="50%" y="58%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="280" fill="url(#textGrad)" letter-spacing="-10">t.</text>
  </g>
</svg>
